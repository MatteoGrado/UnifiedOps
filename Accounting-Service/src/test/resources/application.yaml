spring:
  datasource:
    url: jdbc:h2:mem:accounting-service-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

  cloud:
    consul:
      enabled: false

storage:
  s3:
    access-key: test-access-key
    secret-key: test-secret-key
    region: eu-central-1
    bucket: test-bucket
