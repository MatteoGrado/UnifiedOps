spring:
  application:
    name: consul-service

  cloud:
    consul:
      host: localhost
      port: 8500

      discovery:
        enabled: true
        register: true
        service-name: ${spring.application.name}
        prefer-ip-address: true

server:
  port: 8500

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always
