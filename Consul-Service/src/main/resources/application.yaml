spring:
  application:
    name: Consul-Service

    cloud:
      consul:
        host: localhost
        port: 8500

        discovery:
          enabled: true
          register: true
          service-name: ${spring.application.name}
          health-check-path: /actuator/health
          health-check-interval: 10s

    server:
      port: 8500

    management:
      endpoints:
        web:
          exposure:
            include: health,info
      endpoint:
        health:
          show-details: always