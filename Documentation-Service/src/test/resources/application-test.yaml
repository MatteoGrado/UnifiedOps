spring:
  datasource:
    url: jdbc:h2:mem:documentation_service_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  cloud:
    consul:
      enabled: false
      discovery:
        enabled: false

storage:
  s3:
    access-key: test-access-key
    secret-key: test-secret-key
    region: eu-central-1
    bucket: test-bucket
